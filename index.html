<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>會考每日練習</title>
<style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e0ea;
      --selected: #e8f0ff;
      --danger: #c62828;
      --success: #198754;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 14px;
    }

    .header-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .header-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-card,
    .question-card,
    .message-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(30, 50, 80, 0.08);
    }

    .progress-card {
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      background: #e8edf4;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .question-card {
      padding: 20px;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef3fb;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .question-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 18px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .question-image,
    .option-image {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .option {
      width: 100%;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        transform 0.08s ease;
    }

    .option:active {
      transform: scale(0.99);
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--selected);
    }

    .option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .option-label {
      display: flex;
      flex: 0 0 32px;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #edf1f7;
      font-weight: 800;
    }

    .option.selected .option-label {
      background: var(--primary);
      color: #ffffff;
    }

    .option.correct {
      border-color: var(--success);
      background: #eaf8ef;
    }

    .option.correct .option-label {
      background: var(--success);
      color: #ffffff;
    }

    .option.wrong {
      border-color: var(--danger);
      background: #fdecec;
    }

    .option.wrong .option-label {
      background: var(--danger);
      color: #ffffff;
    }

    .submit-button.answer-correct {
      background: var(--success);
    }

    .submit-button.answer-wrong {
      background: var(--danger);
    }

    .option-text {
      flex: 1;
      padding-top: 4px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:hover {
      background: var(--primary-dark);
    }

    .submit-button:disabled {
      background: #a8b3c5;
      cursor: not-allowed;
    }

    .message-card {
      padding: 20px;
      line-height: 1.65;
    }

    .loading {
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--danger);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .debug {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .completed-card {
      padding: 26px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(30, 50, 80, 0.08);
      text-align: center;
    }

    .completed-icon {
      margin-bottom: 8px;
      font-size: 48px;
    }

    .completed-title {
      margin: 0 0 22px;
      font-size: 24px;
      font-weight: 850;
    }

    .completed-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item {
      display: flex;
      min-height: 92px;
      padding: 14px 10px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #f6f8fc;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .summary-item strong {
      margin-top: 7px;
      font-size: 28px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .correct-summary strong {
      color: var(--success);
    }

    .wrong-summary strong {
      color: var(--danger);
    }

    .completed-note {
      margin-top: 18px;
      padding: 14px;
      background: #eef3fb;
      border-radius: 12px;
      color: #475467;
      line-height: 1.6;
      font-size: 14px;
      text-align: left;
    }

    .completed-actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .action-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .action-button:active {
      transform: scale(0.99);
    }

    .action-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .action-primary:hover {
      background: var(--primary-dark);
    }

    .action-secondary {
      background: #e8f0ff;
      color: var(--primary-dark);
      border: 1px solid #bfd0ff;
    }

    .action-neutral {
      background: #eef1f5;
      color: #344054;
      border: 1px solid var(--border);
    }

    .close-help {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .close-help.hidden {
      display: none;
    }

    .close-help-panel {
      width: 100%;
      max-width: 420px;
      padding: 22px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
      text-align: left;
    }


    .close-help-message {
      margin: 0;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      line-height: 1.6;
      text-align: center;
    }

    .close-help-panel h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .close-help-panel p {
      margin: 8px 0;
      color: #475467;
      line-height: 1.65;
    }

    .close-help-panel .action-button {
      margin-top: 16px;
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1 class="header-title">會考每日練習</h1>
      <div class="header-subtitle">
        每天 15 題，五科各 3 題
      </div>
    </header>

    <section
      id="loadingCard"
      class="message-card loading"
    >
      正在載入今天的題目……
    </section>

    <section
      id="errorCard"
      class="message-card error hidden"
    ></section>

    <section
      id="completedCard"
      class="completed-card hidden"
    >
      <div class="completed-icon">🎉</div>

      <h2 class="completed-title">
        今天的練習完成！
      </h2>

      <div class="completed-summary">
        <div class="summary-item">
          <span class="summary-label">完成題數</span>
          <strong id="completedQuestionCount">15</strong>
        </div>

        <div class="summary-item correct-summary">
          <span class="summary-label">答對題數</span>
          <strong id="completedCorrectCount">0</strong>
        </div>

        <div class="summary-item wrong-summary">
          <span class="summary-label">答錯題數</span>
          <strong id="completedWrongCount">0</strong>
        </div>

        <div class="summary-item">
          <span class="summary-label">真實能力分</span>
          <strong id="completedScore">0</strong>
        </div>

        <div class="summary-item">
          <span class="summary-label">獲得點數</span>
          <strong id="completedPoints">0</strong>
        </div>
      </div>

      <div class="completed-note">
        今日成績已經保存。錯題之後可以到「我的弱點」重新訂正。
      </div>

      <div class="completed-actions">
        <button
          id="reviewWrongButton"
          class="action-button action-primary"
          type="button"
        >
          查看今天錯題
        </button>

        <button
          id="extraPracticeButton"
          class="action-button action-secondary"
          type="button"
        >
          AI 推薦再練 5 題
        </button>

        <button
          id="closePageButton"
          class="action-button action-neutral"
          type="button"
        >
          回到 LINE
        </button>
      </div>

      <div
        id="closeHelp"
        class="close-help hidden"
        role="dialog"
        aria-modal="true"
      >
        <div class="close-help-panel">
          <p class="close-help-message">
            請點擊右上角「×」回到 LINE。
          </p>

          <button
            id="closeHelpOkButton"
            class="action-button action-primary"
            type="button"
          >
            確定
          </button>
        </div>
      </div>
    </section>

    <div id="quizArea" class="hidden">
      <section class="progress-card">
        <div class="progress-row">
          <strong id="progressText">
            第 1 / 15 題
          </strong>

          <span id="subjectText">
            國文
          </span>
        </div>

        <div class="progress-track">
          <div
            id="progressBar"
            class="progress-bar"
          ></div>
        </div>
      </section>

      <section class="question-card">
        <div class="question-meta">
          <span
            id="yearBadge"
            class="badge"
          ></span>

          <span
            id="subjectBadge"
            class="badge"
          ></span>

          <span
            id="difficultyBadge"
            class="badge"
          ></span>
        </div>

        <p
          id="questionText"
          class="question-text"
        ></p>

        <img
          id="questionImage"
          class="question-image hidden"
          alt="題目圖片"
        />

        <div
          id="options"
          class="options"
        ></div>

        <button
          id="submitButton"
          class="submit-button"
          disabled
        >
          請先選擇答案
        </button>
      </section>

      <div
        id="debugInfo"
        class="debug"
      ></div>
    </div>
  </main>

  <script>
    "use strict";
    // ============================================================
    // Supabase 設定
    // ============================================================

    const GET_DAILY_TASK_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/get-daily-task";

    const SUBMIT_DAILY_ANSWER_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/submit-daily-answer";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_VtPQzTC8Cw-ccxC5bSzIuw_nHVbTO3Q";

    // ============================================================
    // 頁面狀態
    // ============================================================

    let dailyTaskData = null;
    let selectedAnswer = null;
    let answerSubmitted = false;
    let questionLoadedAt = 0;
    let lastSubmitResult = null;

    const loadingCard =
      document.getElementById("loadingCard");

    const errorCard =
      document.getElementById("errorCard");

    const completedCard =
      document.getElementById("completedCard");

    const completedQuestionCount =
      document.getElementById(
        "completedQuestionCount",
      );

    const completedCorrectCount =
      document.getElementById(
        "completedCorrectCount",
      );

    const completedWrongCount =
      document.getElementById(
        "completedWrongCount",
      );

    const completedScore =
      document.getElementById(
        "completedScore",
      );

    const completedPoints =
      document.getElementById(
        "completedPoints",
      );

    const reviewWrongButton =
      document.getElementById(
        "reviewWrongButton",
      );

    const extraPracticeButton =
      document.getElementById(
        "extraPracticeButton",
      );

    const closePageButton =
      document.getElementById(
        "closePageButton",
      );

    const closeHelp =
      document.getElementById(
        "closeHelp",
      );

    const closeHelpOkButton =
      document.getElementById(
        "closeHelpOkButton",
      );

    const quizArea =
      document.getElementById("quizArea");

    const progressText =
      document.getElementById("progressText");

    const progressBar =
      document.getElementById("progressBar");

    const subjectText =
      document.getElementById("subjectText");

    const yearBadge =
      document.getElementById("yearBadge");

    const subjectBadge =
      document.getElementById("subjectBadge");

    const difficultyBadge =
      document.getElementById("difficultyBadge");

    const questionText =
      document.getElementById("questionText");

    const questionImage =
      document.getElementById("questionImage");

    const optionsContainer =
      document.getElementById("options");

    const submitButton =
      document.getElementById("submitButton");

    const debugInfo =
      document.getElementById("debugInfo");

    // ============================================================
    // 畫面工具
    // ============================================================

    function showError(message) {
      loadingCard.classList.add("hidden");
      quizArea.classList.add("hidden");
      completedCard.classList.add("hidden");

      errorCard.textContent = message;
      errorCard.classList.add("error");
      errorCard.classList.remove("hidden");
    }

    function showLoading(message) {
      loadingCard.textContent = message;
      loadingCard.classList.remove("hidden");

      errorCard.classList.add("hidden");
      completedCard.classList.add("hidden");
      quizArea.classList.add("hidden");
    }

    // ============================================================
    // LIFF 網址參數
    // ============================================================

    function getParamsFromSearch(searchString) {
      const normalizedSearch =
        searchString.startsWith("?")
          ? searchString
          : `?${searchString}`;

      const params =
        new URLSearchParams(normalizedSearch);

      return {
        dailyTaskId:
          params.get("daily_task_id"),

        rawOrder:
          params.get("order"),
      };
    }

    function getLiffParameters() {
      /*
       * 第一來源：
       * LIFF 初始化完成後的正常網址參數
       */
      const directParams =
        getParamsFromSearch(
          window.location.search,
        );

      if (directParams.dailyTaskId) {
        return directParams;
      }

      /*
       * 第二來源：
       * LINE 有時會把原始參數放在 liff.state 裡。
       *
       * liff.state 的內容可能是：
       * ?daily_task_id=xxx&order=1
       * 或
       * daily_task_id=xxx&order=1
       */
      const currentSearch =
        new URLSearchParams(
          window.location.search,
        );

      const liffState =
        currentSearch.get("liff.state");

      if (liffState) {
        const decodedState =
          decodeURIComponent(liffState);

        const stateParams =
          getParamsFromSearch(decodedState);

        if (stateParams.dailyTaskId) {
          return stateParams;
        }
      }

      /*
       * 第三來源：
       * 某些 LINE WebView 情況可能將參數放進網址 hash。
       */
      const hashText =
        window.location.hash.replace(/^#/, "");

      if (hashText) {
        const hashParams =
          getParamsFromSearch(hashText);

        if (hashParams.dailyTaskId) {
          return hashParams;
        }
      }

      return {
        dailyTaskId: null,
        rawOrder: null,
      };
    }

    function normalizeOrder(rawOrder) {
      const parsedOrder =
        Number(rawOrder || "1");

      if (
        Number.isInteger(parsedOrder) &&
        parsedOrder > 0
      ) {
        return parsedOrder;
      }

      return 1;
    }

    // ============================================================
    // 選項按鈕
    // ============================================================

    function createOptionButton({
      letter,
      text,
      imageUrl,
    }) {
      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "option";
      button.dataset.answer = letter;

      const row =
        document.createElement("div");

      row.className = "option-row";

      const label =
        document.createElement("div");

      label.className = "option-label";
      label.textContent = letter;

      const content =
        document.createElement("div");

      content.className = "option-text";
      content.textContent = text || "";

      row.appendChild(label);
      row.appendChild(content);
      button.appendChild(row);

      if (imageUrl) {
        const image =
          document.createElement("img");

        image.className = "option-image";
        image.src = imageUrl;
        image.alt = `${letter} 選項圖片`;
        image.loading = "lazy";

        button.appendChild(image);
      }

      button.addEventListener("click", () => {
        if (answerSubmitted) {
          return;
        }

        document
          .querySelectorAll(".option")
          .forEach((item) => {
            item.classList.remove("selected");
          });

        button.classList.add("selected");

        selectedAnswer = letter;

        submitButton.disabled = false;
        submitButton.textContent =
          `送出答案 ${letter}`;
      });

      return button;
    }

    // ============================================================
    // 顯示題目
    // ============================================================

    function renderQuestion(data) {
      clearAnswerResult();
      lastSubmitResult = null;
      questionLoadedAt = Date.now();

      const question =
        data.current_question;

      if (!question) {
        throw new Error(
          "後端沒有回傳 current_question。",
        );
      }

      const currentOrder =
        Number(data.current_order || 1);

      const totalQuestions =
        Number(data.total_questions || 15);

      progressText.textContent =
        `第 ${currentOrder} / ${totalQuestions} 題`;

      subjectText.textContent =
        question.subject ||
        question.subject_code ||
        "";

      progressBar.style.width =
        `${Math.min(
          100,
          (currentOrder / totalQuestions) * 100,
        )}%`;

      yearBadge.textContent =
        question.year
          ? `${question.year} 年`
          : "歷屆題";

      subjectBadge.textContent =
        question.subject ||
        question.subject_code ||
        "會考";

      difficultyBadge.textContent =
        question.difficulty
          ? `難度：${question.difficulty}`
          : "難度：未標示";

      questionText.textContent =
        question.question ||
        "題目內容缺失";

      if (question.question_image_url) {
        questionImage.src =
          question.question_image_url;

        questionImage.classList.remove(
          "hidden",
        );
      } else {
        questionImage.removeAttribute("src");

        questionImage.classList.add(
          "hidden",
        );
      }

      const optionDefinitions = [
        {
          letter: "A",
          text: question.option_a,
          imageUrl:
            question.option_a_image_url,
        },
        {
          letter: "B",
          text: question.option_b,
          imageUrl:
            question.option_b_image_url,
        },
        {
          letter: "C",
          text: question.option_c,
          imageUrl:
            question.option_c_image_url,
        },
        {
          letter: "D",
          text: question.option_d,
          imageUrl:
            question.option_d_image_url,
        },
      ];

      optionsContainer.innerHTML = "";

      optionDefinitions.forEach((option) => {
        if (option.text || option.imageUrl) {
          optionsContainer.appendChild(
            createOptionButton(option),
          );
        }
      });

      debugInfo.textContent =
        `Task：${data.daily_task_id}｜題目：${question.question_id}`;

      loadingCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      completedCard.classList.add("hidden");
      quizArea.classList.remove("hidden");
    }

    // ============================================================
    // 載入每日題目
    // ============================================================

    async function loadDailyTask(
      dailyTaskId,
      order,
    ) {
      if (
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY ===
          "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        throw new Error(
          "尚未設定 Supabase Publishable Key。",
        );
      }

      showLoading(
        `正在載入第 ${order} 題……`,
      );

      const response =
        await fetch(GET_DAILY_TASK_URL, {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,
          },

          body: JSON.stringify({
            daily_task_id:
              dailyTaskId,

            current_order:
              order,
          }),
        });

      /*
       * 先讀成文字，再嘗試解析 JSON。
       * 這樣即使 Edge Function 回傳的不是 JSON，
       * 也能顯示真正錯誤內容。
       */
      const responseText =
        await response.text();

      let result;

      try {
        result =
          JSON.parse(responseText);
      } catch (parseError) {
        throw new Error(
          [
            "後端回傳的內容不是有效 JSON。",
            "",
            `HTTP 狀態：${response.status}`,
            "",
            "後端實際回傳：",
            responseText.slice(0, 1000),
          ].join("\n"),
        );
      }

      if (
        !response.ok ||
        result.success !== true
      ) {
        const backendMessage =
          result.message ||
          result.error ||
          result.details ||
          "後端沒有提供錯誤說明";

        throw new Error(
          [
            `讀取題目失敗，HTTP ${response.status}`,
            "",
            String(backendMessage),
          ].join("\n"),
        );
      }

      dailyTaskData = result;
      selectedAnswer = null;

      /*
       * 若今日任務已完成，後端不會再回傳 current_question。
       * 直接顯示完成頁，避免 renderQuestion() 因找不到題目而報錯。
       */
      if (result.task_completed === true) {
        showCompletedResult(result);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent =
        "請先選擇答案";

      renderQuestion(result);
    }

    // ============================================================
    // 作答頁啟動
    // ============================================================

    async function initializeApp() {
      try {
        showLoading(
          "正在讀取今天的任務……",
        );

        console.log(
          "目前網址：",
          window.location.href,
        );

        console.log(
          "網址參數：",
          window.location.search,
        );

        /*
         * 不執行 liff.init()。
         * 本頁只需要讀取網址中的 daily_task_id 與 order，
         * 再呼叫 Supabase Edge Function 取得題目。
         *
         * getLiffParameters() 同時支援：
         * 1. 一般 query string
         * 2. LINE 轉送的 liff.state
         * 3. hash 參數
         */
        const {
          dailyTaskId,
          rawOrder,
        } = getLiffParameters();

        const order =
          normalizeOrder(rawOrder);

        console.log(
          "daily_task_id：",
          dailyTaskId,
        );

        console.log(
          "order：",
          order,
        );

        if (!dailyTaskId) {
          throw new Error(
            [
              "網址缺少 daily_task_id。",
              "",
              "請回到 LINE，重新點擊最新訊息中的「開始今天練習」。",
              "",
              "目前網址：",
              window.location.href,
            ].join("\n"),
          );
        }

        await loadDailyTask(
          dailyTaskId,
          order,
        );
      } catch (error) {
        console.error(
          "作答頁啟動失敗：",
          error,
        );

        const message =
          error instanceof Error
            ? error.message
            : String(error);

        showError(
          [
            "系統發生問題",
            "",
            message,
          ].join("\n"),
        );
      }
    }

    // ============================================================
    // 作答、判斷與下一題
    // ============================================================

    function clearAnswerResult() {
      answerSubmitted = false;
      selectedAnswer = null;

      document
        .querySelectorAll(".option")
        .forEach((item) => {
          item.classList.remove(
            "selected",
            "correct",
            "wrong",
          );

          item.disabled = false;
        });

      submitButton.classList.remove(
        "answer-correct",
        "answer-wrong",
      );

      submitButton.disabled = true;
      submitButton.textContent =
        "請先選擇答案";
    }

    function markAnswerResult(
      selected,
      correct,
    ) {
      document
        .querySelectorAll(".option")
        .forEach((button) => {
          const answer =
            button.dataset.answer;

          button.disabled = true;

          if (answer === correct) {
            button.classList.add("correct");
          }

          if (
            answer === selected &&
            selected !== correct
          ) {
            button.classList.add("wrong");
          }
        });
    }

    async function submitDailyAnswer() {
      const currentOrder =
        Number(
          dailyTaskData?.current_order || 1,
        );

      const responseTimeMs =
        questionLoadedAt > 0
          ? Math.max(0, Date.now() - questionLoadedAt)
          : 0;

      const response =
        await fetch(SUBMIT_DAILY_ANSWER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
          },

          body: JSON.stringify({
            daily_task_id:
              dailyTaskData.daily_task_id,

            order:
              currentOrder,

            selected_answer:
              selectedAnswer,

            response_time_ms:
              responseTimeMs,
          }),
        });

      const responseText =
        await response.text();

      let result;

      try {
        result =
          JSON.parse(responseText);
      } catch {
        throw new Error(
          [
            "作答後端回傳的內容不是有效 JSON。",
            "",
            `HTTP 狀態：${response.status}`,
            "",
            responseText.slice(0, 1000),
          ].join("\n"),
        );
      }

      if (
        !response.ok ||
        result.success !== true
      ) {
        throw new Error(
          result.error ||
          result.message ||
          `送出答案失敗，HTTP ${response.status}`,
        );
      }

      return result;
    }

    function showCompletedResult(result) {
      loadingCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      quizArea.classList.add("hidden");

      completedQuestionCount.textContent =
        Number(
          result.completed_question_count ?? 15,
        );

      completedCorrectCount.textContent =
        Number(result.correct_count ?? 0);

      completedWrongCount.textContent =
        Number(result.wrong_count ?? 0);

      completedScore.textContent =
        Number(result.score ?? 0);

      completedPoints.textContent =
        Number(result.earned_points ?? 0);

      completedCard.classList.remove("hidden");
    }

    async function goToNextQuestion() {
      if (lastSubmitResult?.task_completed) {
        showCompletedResult(lastSubmitResult);
        return;
      }

      const currentOrder =
        Number(
          dailyTaskData?.current_order || 1,
        );

      const totalQuestions =
        Number(
          dailyTaskData?.total_questions || 15,
        );

      const nextOrder =
        Number(
          lastSubmitResult?.next_order ||
          currentOrder + 1,
        );

      if (
        currentOrder >= totalQuestions ||
        nextOrder > totalQuestions
      ) {
        showCompletedResult({
          completed_question_count:
            totalQuestions,
          correct_count:
            lastSubmitResult?.correct_count || 0,
          wrong_count:
            lastSubmitResult?.wrong_count || 0,
          score:
            lastSubmitResult?.score || 0,
          earned_points:
            lastSubmitResult?.earned_points || 0,
        });
        return;
      }

      clearAnswerResult();

      await loadDailyTask(
        dailyTaskData.daily_task_id,
        nextOrder,
      );
    }

    submitButton.addEventListener(
      "click",
      async () => {
        if (!dailyTaskData) {
          return;
        }

        /*
         * 第二次按按鈕：
         * 進入下一題。
         */
        if (answerSubmitted) {
          submitButton.disabled = true;
          submitButton.textContent =
            "正在載入下一題……";

          try {
            await goToNextQuestion();
          } catch (error) {
            console.error(
              "載入下一題失敗：",
              error,
            );

            showError(
              [
                "載入下一題失敗",
                "",
                error instanceof Error
                  ? error.message
                  : String(error),
              ].join("\n"),
            );
          }

          return;
        }

        /*
         * 第一次按按鈕：
         * 呼叫 submit-daily-answer，由後端判題並寫入資料庫。
         */
        if (!selectedAnswer) {
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent =
          "正在送出答案……";

        document
          .querySelectorAll(".option")
          .forEach((button) => {
            button.disabled = true;
          });

        try {
          const result =
            await submitDailyAnswer();

          lastSubmitResult = result;
          answerSubmitted = true;

          const submittedAnswer =
            String(
              result.selected_answer ||
              selectedAnswer,
            )
              .trim()
              .toUpperCase();

          const correctAnswer =
            String(
              result.correct_answer || "",
            )
              .trim()
              .toUpperCase();

          markAnswerResult(
            submittedAnswer,
            correctAnswer,
          );

          if (result.is_correct === true) {
            submitButton.textContent =
              result.task_completed
                ? "✅ 答對了！查看今日結果"
                : "✅ 答對了！點擊進入下一題";

            submitButton.classList.remove(
              "answer-wrong",
            );

            submitButton.classList.add(
              "answer-correct",
            );
          } else {
            submitButton.textContent =
              result.task_completed
                ? `❌ 答錯了，正確答案是 ${correctAnswer}｜查看今日結果`
                : `❌ 答錯了，正確答案是 ${correctAnswer}｜點擊進入下一題`;

            submitButton.classList.remove(
              "answer-correct",
            );

            submitButton.classList.add(
              "answer-wrong",
            );
          }

          submitButton.disabled = false;
        } catch (error) {
          console.error(
            "送出答案失敗：",
            error,
          );

          answerSubmitted = false;

          document
            .querySelectorAll(".option")
            .forEach((button) => {
              button.disabled = false;
            });

          submitButton.disabled = false;
          submitButton.textContent =
            `重新送出答案 ${selectedAnswer}`;

          alert(
            [
              "送出答案失敗",
              "",
              error instanceof Error
                ? error.message
                : String(error),
            ].join("\n"),
          );
        }
      },
    );

    reviewWrongButton.addEventListener(
      "click",
      () => {
        alert(
          "「查看今天錯題」會在下一階段接上錯題本流程。\n\n目前先保留按鈕位置，不會修改今日原始成績。",
        );
      },
    );

    extraPracticeButton.addEventListener(
      "click",
      () => {
        alert(
          "「AI 推薦再練 5 題」會在下一階段建立 extra_practice / generated_practice。\n\n這 5 題不計入今日基礎分。",
        );
      },
    );

    closePageButton.addEventListener(
      "click",
      () => {
        /*
         * 目前頁面是 GitHub Pages 直連，不是 LIFF。
         * LINE WebView 通常不允許一般網頁呼叫 window.close()。
         * 先嘗試關閉；若失敗，顯示明確操作提示。
         */
        window.close();

        window.setTimeout(() => {
          closeHelp.classList.remove("hidden");
        }, 250);
      },
    );

    closeHelpOkButton.addEventListener(
      "click",
      () => {
        closeHelp.classList.add("hidden");
      },
    );

    // 等 HTML 完整載入後再啟動作答頁
    window.addEventListener(
      "DOMContentLoaded",
      initializeApp,
    );
  </script>
</body>
</html>
