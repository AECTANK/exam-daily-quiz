<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>會考每日練習</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e0ea;
      --selected: #e8f0ff;
      --danger: #c62828;
      --success: #198754;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 14px;
    }

    .header-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .header-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-card,
    .question-card,
    .message-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(30, 50, 80, 0.08);
    }

    .progress-card {
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      background: #e8edf4;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .question-card {
      padding: 20px;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef3fb;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .question-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 18px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .question-image,
    .option-image {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .option {
      width: 100%;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        transform 0.08s ease;
    }

    .option:active {
      transform: scale(0.99);
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--selected);
    }

    .option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .option-label {
      display: flex;
      flex: 0 0 32px;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #edf1f7;
      font-weight: 800;
    }

    .option.selected .option-label {
      background: var(--primary);
      color: #ffffff;
    }

    .option.correct {
      border-color: var(--success);
      background: #eaf8ef;
    }

    .option.correct .option-label {
      background: var(--success);
      color: #ffffff;
    }

    .option.wrong {
      border-color: var(--danger);
      background: #fdecec;
    }

    .option.wrong .option-label {
      background: var(--danger);
      color: #ffffff;
    }

    .submit-button.answer-correct {
      background: var(--success);
    }

    .submit-button.answer-wrong {
      background: var(--danger);
    }

    .option-text {
      flex: 1;
      padding-top: 4px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:hover {
      background: var(--primary-dark);
    }

    .submit-button:disabled {
      background: #a8b3c5;
      cursor: not-allowed;
    }

    .message-card {
      padding: 20px;
      line-height: 1.65;
    }

    .loading {
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--danger);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .debug {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .completed-card {
      padding: 26px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(30, 50, 80, 0.08);
      text-align: center;
    }

    .completed-icon {
      margin-bottom: 8px;
      font-size: 48px;
    }

    .completed-title {
      margin: 0 0 22px;
      font-size: 24px;
      font-weight: 850;
    }

    .completed-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item {
      display: flex;
      min-height: 92px;
      padding: 14px 10px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #f6f8fc;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .summary-item strong {
      margin-top: 7px;
      font-size: 28px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .correct-summary strong {
      color: var(--success);
    }

    .wrong-summary strong {
      color: var(--danger);
    }

    .completed-note {
      margin-top: 18px;
      padding: 14px;
      background: #eef3fb;
      border-radius: 12px;
      color: #475467;
      line-height: 1.6;
      font-size: 14px;
      text-align: left;
    }

    .completed-actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .action-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .action-button:active {
      transform: scale(0.99);
    }

    .action-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .action-primary:hover {
      background: var(--primary-dark);
    }

    .action-secondary {
      background: #e8f0ff;
      color: var(--primary-dark);
      border: 1px solid #bfd0ff;
    }

    .action-neutral {
      background: #eef1f5;
      color: #344054;
      border: 1px solid var(--border);
    }

    .close-help {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .close-help.hidden {
      display: none;
    }

    .close-help-panel {
      width: 100%;
      max-width: 420px;
      padding: 22px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
      text-align: left;
    }


    .close-help-message {
      margin: 0;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      line-height: 1.6;
      text-align: center;
    }

    .close-help-panel h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .close-help-panel p {
      margin: 8px 0;
      color: #475467;
      line-height: 1.65;
    }

    .close-help-panel .action-button {
      margin-top: 16px;
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1 class="header-title">會考每日練習</h1>
      <div class="header-subtitle">
        每天 15 題，五科各 3 題
      </div>
    </header>

    <section
      id="loadingCard"
      class="message-card loading"
    >
      正在載入今天的題目……
    </section>

    <section
      id="errorCard"
      class="message-card error hidden"
    ></section>

    <section
      id="completedCard"
      class="completed-card hidden"
    >
      <div class="completed-icon">🎉</div>

      <h2 class="completed-title">
        今天的練習完成！
      </h2>

      <div class="completed-summary">
        <div class="summary-item">
          <span class="summary-label">完成題數</span>
          <strong id="completedQuestionCount">15</strong>
        </div>

        <div class="summary-item correct-summary">
          <span class="summary-label">答對題數</span>
          <strong id="completedCorrectCount">0</strong>
        </div>

        <div class="summary-item wrong-summary">
          <span class="summary-label">答錯題數</span>
          <strong id="completedWrongCount">0</strong>
        </div>

        <div class="summary-item">
          <span id="completedScoreLabel" class="summary-label">真實能力分</span>
          <strong id="completedScore">0</strong>
        </div>

        <div class="summary-item">
          <span class="summary-label">獲得點數</span>
          <strong id="completedPoints">0</strong>
        </div>
      </div>

      <div class="completed-note">
        今日成績已經保存。錯題之後可以到「我的弱點」重新訂正。
      </div>

      <div class="completed-actions">
        <button
          id="reviewWrongButton"
          class="action-button action-primary"
          type="button"
        >
          查看今天錯題
        </button>

        <button
          id="extraPracticeButton"
          class="action-button action-secondary"
          type="button"
        >
          AI 推薦再練 5 題
        </button>

        <button
          id="closePageButton"
          class="action-button action-neutral"
          type="button"
        >
          回到 LINE
        </button>
      </div>

      <div
        id="closeHelp"
        class="close-help hidden"
        role="dialog"
        aria-modal="true"
      >
        <div class="close-help-panel">
          <p class="close-help-message">
            請點擊右上角「×」回到 LINE。
          </p>

          <button
            id="closeHelpOkButton"
            class="action-button action-primary"
            type="button"
          >
            確定
          </button>
        </div>
      </div>
    </section>

    <div id="quizArea" class="hidden">
      <section class="progress-card">
        <div class="progress-row">
          <strong id="progressText">
            第 1 / 15 題
          </strong>

          <span id="subjectText">
            國文
          </span>
        </div>

        <div class="progress-track">
          <div
            id="progressBar"
            class="progress-bar"
          ></div>
        </div>
      </section>

      <section class="question-card">
        <div class="question-meta">
          <span
            id="yearBadge"
            class="badge"
          ></span>

          <span
            id="subjectBadge"
            class="badge"
          ></span>

          <span
            id="difficultyBadge"
            class="badge"
          ></span>
        </div>

        <p
          id="questionText"
          class="question-text"
        ></p>

        <img
          id="questionImage"
          class="question-image hidden"
          alt="題目圖片"
        />

        <div
          id="options"
          class="options"
        ></div>

        <button
          id="submitButton"
          class="submit-button"
          disabled
        >
          請先選擇答案
        </button>
      </section>

      <div
        id="debugInfo"
        class="debug"
      ></div>
    </div>
  </main>

  <script>
    "use strict";

    // ============================================================
    // Supabase Edge Function 設定
    // ============================================================

    const GET_DAILY_TASK_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/get-daily-task";

    const SUBMIT_DAILY_ANSWER_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/submit-daily-answer";

    // 錯題重練模式使用的兩支 Edge Function。
    const GET_WRONG_QUESTION_RETRY_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/get-wrong-question-retry";

    const SUBMIT_WRONG_QUESTION_ANSWER_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/submit-wrong-question-answer";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_VtPQzTC8Cw-ccxC5bSzIuw_nHVbTO3Q";

    const LIFF_ID = "2010921992-NsV1lmUe";
    let liffReady = false;

    // ============================================================
    // 頁面狀態
    // ============================================================

    let currentMode = "daily_task";
    let currentData = null;
    let selectedAnswer = null;
    let answerSubmitted = false;
    let questionLoadedAt = 0;
    let lastSubmitResult = null;
    let currentParams = null;

    const headerTitle = document.querySelector(".header-title");
    const headerSubtitle = document.querySelector(".header-subtitle");
    const completedTitle = document.querySelector(".completed-title");
    const completedNote = document.querySelector(".completed-note");

    const loadingCard = document.getElementById("loadingCard");
    const errorCard = document.getElementById("errorCard");
    const completedCard = document.getElementById("completedCard");
    const completedQuestionCount = document.getElementById("completedQuestionCount");
    const completedCorrectCount = document.getElementById("completedCorrectCount");
    const completedWrongCount = document.getElementById("completedWrongCount");
    const completedScore = document.getElementById("completedScore");
    const completedScoreLabel = document.getElementById("completedScoreLabel");
    const completedPoints = document.getElementById("completedPoints");
    const reviewWrongButton = document.getElementById("reviewWrongButton");
    const extraPracticeButton = document.getElementById("extraPracticeButton");
    const closePageButton = document.getElementById("closePageButton");
    const closeHelp = document.getElementById("closeHelp");
    const closeHelpOkButton = document.getElementById("closeHelpOkButton");
    const quizArea = document.getElementById("quizArea");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const subjectText = document.getElementById("subjectText");
    const yearBadge = document.getElementById("yearBadge");
    const subjectBadge = document.getElementById("subjectBadge");
    const difficultyBadge = document.getElementById("difficultyBadge");
    const questionText = document.getElementById("questionText");
    const questionImage = document.getElementById("questionImage");
    const optionsContainer = document.getElementById("options");
    const submitButton = document.getElementById("submitButton");
    const debugInfo = document.getElementById("debugInfo");

    const hintCard = document.createElement("div");
    hintCard.id = "hintCard";
    hintCard.className = "message-card hidden";
    hintCard.style.marginTop = "16px";
    hintCard.style.background = "#fff7ed";
    hintCard.style.borderColor = "#fed7aa";
    hintCard.style.color = "#9a3412";
    hintCard.style.fontWeight = "700";
    document.querySelector(".question-card").appendChild(hintCard);

    // ============================================================
    // 畫面工具
    // ============================================================

    function showError(message) {
      loadingCard.classList.add("hidden");
      quizArea.classList.add("hidden");
      completedCard.classList.add("hidden");
      errorCard.textContent = message;
      errorCard.classList.add("error");
      errorCard.classList.remove("hidden");
    }

    function showLoading(message) {
      loadingCard.textContent = message;
      loadingCard.classList.remove("hidden");
      errorCard.classList.add("hidden");
      completedCard.classList.add("hidden");
      quizArea.classList.add("hidden");
    }

    function hideHint() {
      hintCard.textContent = "";
      hintCard.classList.add("hidden");
    }

    function showHint(message) {
      const text = String(message || "").trim();
      if (!text) {
        hideHint();
        return;
      }
      hintCard.textContent = `提示：${text}`;
      hintCard.classList.remove("hidden");
    }

    function configurePageForMode(mode) {
      if (mode === "wrong_question") {
        document.title = "會考錯題重練";
        headerTitle.textContent = "會考錯題重練";
        headerSubtitle.textContent = "先自己重作；答錯後才逐步取得提示";
        completedTitle.textContent = "這題訂正完成！";
        completedNote.textContent = "本次訂正紀錄已保存，原本的每日練習成績不會被修改。";
        completedScoreLabel.textContent = "訂正積分";
        reviewWrongButton.textContent = "返回錯題本";
        extraPracticeButton.classList.add("hidden");
      } else {
        document.title = "會考每日練習";
        headerTitle.textContent = "會考每日練習";
        headerSubtitle.textContent = "每天 15 題，五科各 3 題";
        completedTitle.textContent = "今天的練習完成！";
        completedNote.textContent = "今日成績已經保存。錯題之後可以到「我的弱點」重新訂正。";
        completedScoreLabel.textContent = "真實能力分";
        reviewWrongButton.textContent = "查看今天錯題";
        extraPracticeButton.classList.remove("hidden");
      }
    }

    async function fetchJson(url, body, actionName) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        },
        body: JSON.stringify(body),
      });

      const responseText = await response.text();
      let result;

      try {
        result = JSON.parse(responseText);
      } catch {
        throw new Error([
          `${actionName}後端回傳的內容不是有效 JSON。`,
          "",
          `HTTP 狀態：${response.status}`,
          "",
          responseText.slice(0, 1200),
        ].join("\n"));
      }

      if (!response.ok || result.success === false) {
        throw new Error([
          `${actionName}失敗，HTTP ${response.status}`,
          "",
          String(result.message || result.error || result.details || "後端沒有提供錯誤說明"),
        ].join("\n"));
      }

      return result;
    }

    // ============================================================
    // LIFF 初始化與關閉
    // ============================================================

    async function initializeLiff() {
      if (!window.liff) {
        console.warn("LIFF SDK 尚未載入");
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        liffReady = true;
        console.log("LIFF 初始化完成：", LIFF_ID);
      } catch (error) {
        liffReady = false;
        console.error("LIFF 初始化失敗：", error);
      }
    }

    function closeLiffWindow() {
      if (
        liffReady &&
        window.liff &&
        typeof liff.isInClient === "function" &&
        liff.isInClient()
      ) {
        liff.closeWindow();
        return true;
      }

      return false;
    }

    async function sendMessageAndCloseLiff(messageText) {
      const text = String(messageText || "").trim();

      if (!text) {
        throw new Error("缺少要送出的 LINE 訊息內容");
      }

      if (
        !liffReady ||
        !window.liff ||
        typeof liff.isInClient !== "function" ||
        !liff.isInClient()
      ) {
        throw new Error("目前頁面不是從 LINE LIFF 開啟");
      }

      if (typeof liff.sendMessages !== "function") {
        throw new Error("目前 LIFF 環境不支援 sendMessages");
      }

      await liff.sendMessages([
        {
          type: "text",
          text,
        },
      ]);

      // 讓 LINE 有短暫時間接收訊息，再關閉 LIFF WebView。
      window.setTimeout(() => {
        liff.closeWindow();
      }, 250);
    }

    // ============================================================
    // 網址參數：同時支援一般 query、liff.state、hash
    // ============================================================

    function getParamsFromSearch(searchString) {
      const normalizedSearch = searchString.startsWith("?")
        ? searchString
        : `?${searchString}`;
      const params = new URLSearchParams(normalizedSearch);

      return {
        mode: params.get("mode") || null,
        dailyTaskId: params.get("daily_task_id"),
        sessionId: params.get("session_id"),
        wrongQuestionId: params.get("wrong_question_id"),
        rawOrder: params.get("order"),
      };
    }

    function hasUsableParams(params) {
      return Boolean(
        params.dailyTaskId ||
        params.sessionId ||
        params.wrongQuestionId ||
        params.mode
      );
    }

    function getLiffParameters() {
      const directParams = getParamsFromSearch(window.location.search);
      if (hasUsableParams(directParams)) return directParams;

      const currentSearch = new URLSearchParams(window.location.search);
      const liffState = currentSearch.get("liff.state");
      if (liffState) {
        const stateParams = getParamsFromSearch(decodeURIComponent(liffState));
        if (hasUsableParams(stateParams)) return stateParams;
      }

      const hashText = window.location.hash.replace(/^#/, "");
      if (hashText) {
        const hashParams = getParamsFromSearch(hashText);
        if (hasUsableParams(hashParams)) return hashParams;
      }

      return {
        mode: null,
        dailyTaskId: null,
        sessionId: null,
        wrongQuestionId: null,
        rawOrder: null,
      };
    }

    function normalizeOrder(rawOrder) {
      const parsedOrder = Number(rawOrder || "1");
      return Number.isInteger(parsedOrder) && parsedOrder > 0
        ? parsedOrder
        : 1;
    }

    // ============================================================
    // 選項與題目顯示
    // ============================================================

    function createOptionButton({ letter, text, imageUrl }) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.dataset.answer = letter;

      const row = document.createElement("div");
      row.className = "option-row";

      const label = document.createElement("div");
      label.className = "option-label";
      label.textContent = letter;

      const content = document.createElement("div");
      content.className = "option-text";
      content.textContent = text || "";

      row.appendChild(label);
      row.appendChild(content);
      button.appendChild(row);

      if (imageUrl) {
        const image = document.createElement("img");
        image.className = "option-image";
        image.src = imageUrl;
        image.alt = `${letter} 選項圖片`;
        image.loading = "lazy";
        button.appendChild(image);
      }

      button.addEventListener("click", () => {
        if (answerSubmitted) return;

        document.querySelectorAll(".option").forEach((item) => {
          item.classList.remove("selected");
        });

        button.classList.add("selected");
        selectedAnswer = letter;
        submitButton.disabled = false;
        submitButton.textContent = `送出答案 ${letter}`;
      });

      return button;
    }

    function getQuestionFromResult(data) {
      return data.current_question || data.question || data.retry_question || null;
    }

    function buildRestoredHint(data) {
      const question = getQuestionFromResult(data) || {};
      const hintLevel = Number(data?.rules?.hint_level || 0);

      if (hintLevel <= 0) {
        return "";
      }

      if (hintLevel === 1) {
        return (
          question.skill ||
          question.knowledge_tree ||
          question.category ||
          "重新找出題目中的關鍵條件，再逐一排除不符合的選項。"
        );
      }

      const parts = [
        question.knowledge_tree,
        question.category,
        question.skill,
      ].filter((value, index, array) => {
        const text = String(value || "").trim();
        return text && array.findIndex((item) => String(item || "").trim() === text) === index;
      });

      return parts.length > 0
        ? `請把題目歸回「${parts.join("／")}」來判斷，並逐項核對選項。`
        : "把題目中的人物、時間、地點、因果或數量條件分開整理，再重新比較四個選項。";
    }

    function renderQuestion(data) {
      clearAnswerResult();
      lastSubmitResult = null;
      questionLoadedAt = Date.now();

      const question = getQuestionFromResult(data);
      if (!question) {
        throw new Error("後端沒有回傳 current_question、question 或 retry_question。");
      }

      const currentOrder = Number(data.current_order || data.order || 1);
      const totalQuestions = currentMode === "wrong_question"
        ? Number(data.total_questions || 1)
        : Number(data.total_questions || 15);

      if (currentMode === "wrong_question") {
        const nextAttemptNo = Number(
          data?.rules?.next_attempt_no ??
          question?.retry?.attempt_no ??
          1
        );

        progressText.textContent = `第 ${nextAttemptNo} / 3 次作答`;
        progressBar.style.width = `${Math.min(100, (nextAttemptNo / 3) * 100)}%`;
      } else {
        progressText.textContent = `第 ${currentOrder} / ${totalQuestions} 題`;
        progressBar.style.width = `${Math.min(100, (currentOrder / totalQuestions) * 100)}%`;
      }

      subjectText.textContent = question.subject || question.subject_code || "";
      yearBadge.textContent = question.year ? `${question.year} 年` : "歷屆題";
      subjectBadge.textContent = question.subject || question.subject_code || "會考";
      difficultyBadge.textContent = question.difficulty
        ? `難度：${question.difficulty}`
        : "難度：未標示";
      questionText.textContent = question.question || "題目內容缺失";

      const qImage = question.question_image_url || question.question_image_file_url;
      if (qImage) {
        questionImage.src = qImage;
        questionImage.classList.remove("hidden");
      } else {
        questionImage.removeAttribute("src");
        questionImage.classList.add("hidden");
      }

      const optionDefinitions = [
        { letter: "A", text: question.option_a, imageUrl: question.option_a_image_url },
        { letter: "B", text: question.option_b, imageUrl: question.option_b_image_url },
        { letter: "C", text: question.option_c, imageUrl: question.option_c_image_url },
        { letter: "D", text: question.option_d, imageUrl: question.option_d_image_url },
      ];

      optionsContainer.innerHTML = "";
      optionDefinitions.forEach((option) => {
        if (option.text || option.imageUrl) {
          optionsContainer.appendChild(createOptionButton(option));
        }
      });

      if (currentMode === "wrong_question") {
        debugInfo.textContent = `Session：${currentParams.sessionId}｜錯題：${currentParams.wrongQuestionId}`;
      } else {
        debugInfo.textContent = `Task：${data.daily_task_id}｜題目：${question.question_id || question.id || "—"}`;
      }

      loadingCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      completedCard.classList.add("hidden");
      quizArea.classList.remove("hidden");
    }

    // ============================================================
    // 載入題目
    // ============================================================

    async function loadDailyTask(dailyTaskId, order) {
      showLoading(`正在載入第 ${order} 題……`);

      const result = await fetchJson(
        GET_DAILY_TASK_URL,
        { daily_task_id: dailyTaskId, current_order: order },
        "讀取每日題目",
      );

      currentData = result;
      selectedAnswer = null;

      if (result.task_completed === true) {
        showCompletedResult(result);
        return;
      }

      renderQuestion(result);
    }

    async function loadWrongQuestionRetry(sessionId, wrongQuestionId, order) {
      showLoading("正在載入錯題重練……");

      const result = await fetchJson(
        GET_WRONG_QUESTION_RETRY_URL,
        {
          session_id: sessionId,
          wrong_question_id: wrongQuestionId,
          current_order: order,
        },
        "讀取錯題重練",
      );

      currentData = result;
      selectedAnswer = null;

      const retryCompleted =
        result.retry_completed === true ||
        result.session_completed === true ||
        result.mastered === true ||
        result?.rules?.retry_completed === true ||
        result?.session?.status === "completed";

      if (retryCompleted) {
        showCompletedResult(result);
        return;
      }

      renderQuestion(result);

      if (result?.rules?.show_hint === true) {
        const restoredHint = buildRestoredHint(result);
        showHint(restoredHint || result?.rules?.message || "");
        submitButton.textContent = "看完提示後，請重新選擇答案";
      }
    }

    // ============================================================
    // 啟動頁面
    // ============================================================

    async function initializeApp() {
      try {
        await initializeLiff();

        if (!SUPABASE_PUBLISHABLE_KEY) {
          throw new Error("尚未設定 Supabase Publishable Key。");
        }

        currentParams = getLiffParameters();
        currentMode = currentParams.mode === "wrong_question"
          ? "wrong_question"
          : "daily_task";

        configurePageForMode(currentMode);

        const order = normalizeOrder(currentParams.rawOrder);

        console.log("目前網址：", window.location.href);
        console.log("解析參數：", currentParams);
        console.log("目前模式：", currentMode);

        if (currentMode === "wrong_question") {
          if (!currentParams.sessionId) {
            throw new Error("錯題重練網址缺少 session_id。");
          }
          if (!currentParams.wrongQuestionId) {
            throw new Error("錯題重練網址缺少 wrong_question_id。");
          }

          await loadWrongQuestionRetry(
            currentParams.sessionId,
            currentParams.wrongQuestionId,
            order,
          );
          return;
        }

        if (!currentParams.dailyTaskId) {
          throw new Error([
            "網址缺少 daily_task_id。",
            "",
            "請回到 LINE，重新點擊最新訊息中的「開始今天練習」。",
            "",
            "目前網址：",
            window.location.href,
          ].join("\n"));
        }

        await loadDailyTask(currentParams.dailyTaskId, order);
      } catch (error) {
        console.error("作答頁啟動失敗：", error);
        showError([
          "系統發生問題",
          "",
          error instanceof Error ? error.message : String(error),
        ].join("\n"));
      }
    }

    // ============================================================
    // 作答與判題
    // ============================================================

    function clearAnswerResult() {
      answerSubmitted = false;
      selectedAnswer = null;
      hideHint();

      document.querySelectorAll(".option").forEach((item) => {
        item.classList.remove("selected", "correct", "wrong");
        item.disabled = false;
      });

      submitButton.classList.remove("answer-correct", "answer-wrong");
      submitButton.disabled = true;
      submitButton.textContent = "請先選擇答案";
    }

    function markAnswerResult(selected, isCorrect) {
      document.querySelectorAll(".option").forEach((button) => {
        const answer = String(button.dataset.answer || "").trim().toUpperCase();
        button.disabled = true;

        // 不揭露正確選項，只標示學生本次所選答案的對錯。
        if (answer === selected) {
          button.classList.remove("selected", "correct", "wrong");
          button.classList.add(isCorrect ? "correct" : "wrong");
        }
      });
    }

    async function submitDailyAnswer() {
      const currentOrder = Number(currentData?.current_order || 1);
      const responseTimeMs = questionLoadedAt > 0
        ? Math.max(0, Date.now() - questionLoadedAt)
        : 0;

      return await fetchJson(
        SUBMIT_DAILY_ANSWER_URL,
        {
          daily_task_id: currentData.daily_task_id,
          order: currentOrder,
          selected_answer: selectedAnswer,
          response_time_ms: responseTimeMs,
        },
        "送出每日答案",
      );
    }

    async function submitWrongQuestionAnswer() {
      const currentOrder = Number(currentData?.current_order || currentData?.order || 1);
      const responseTimeMs = questionLoadedAt > 0
        ? Math.max(0, Date.now() - questionLoadedAt)
        : 0;

      return await fetchJson(
        SUBMIT_WRONG_QUESTION_ANSWER_URL,
        {
          session_id: currentParams.sessionId,
          wrong_question_id: currentParams.wrongQuestionId,
          order: currentOrder,
          selected_answer: selectedAnswer,
          response_time_ms: responseTimeMs,
        },
        "送出錯題重練答案",
      );
    }

    function showCompletedResult(result) {
      loadingCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      quizArea.classList.add("hidden");

      if (currentMode === "wrong_question") {
        const session = result.session || {};
        const isCorrect =
          result.is_correct === true ||
          Number(session.correct_count || 0) > 0;

        const correctionPoints = Number(
          result.points_earned ??
          result.correction_points ??
          result.earned_points ??
          session.earned_points ??
          0
        );

        const wrongAttempts = Number(
          result.session_wrong_count ??
          session.wrong_count ??
          (isCorrect ? 0 : result.attempt_no ?? 1)
        );

        completedTitle.textContent = isCorrect
          ? "這題訂正完成！"
          : "這次重練已完成";

        completedQuestionCount.textContent = 1;
        completedCorrectCount.textContent = isCorrect ? 1 : 0;
        completedWrongCount.textContent = wrongAttempts;

        // 錯題重練不修改每日練習的真實能力分。
        completedScore.textContent = correctionPoints;
        completedPoints.textContent = correctionPoints;

        const noteParts = [];

        if (result.message) {
          noteParts.push(String(result.message));
        } else if (isCorrect) {
          noteParts.push("本次訂正紀錄已保存，原本的每日練習成績不會被修改。");
        } else {
          noteParts.push("本次三次作答均未答對，請查看正確答案與解析。");
        }

        if (result.show_correct_answer === true && result.correct_answer) {
          noteParts.push(`正確答案：${String(result.correct_answer).trim().toUpperCase()}`);
        }

        if (result.show_explanation === true && result.explanation) {
          noteParts.push(`解析：${String(result.explanation).trim()}`);
        }

        if (result.mastery_status) {
          const masteryMap = {
            unresolved: "待訂正",
            reviewing: "複習中",
            mastered: "已掌握",
          };
          noteParts.push(`目前狀態：${masteryMap[result.mastery_status] || result.mastery_status}`);
        }

        completedNote.textContent = noteParts.join("\n\n");
        completedNote.style.whiteSpace = "pre-wrap";
      } else {
        completedQuestionCount.textContent = Number(result.completed_question_count ?? 15);
        completedCorrectCount.textContent = Number(result.correct_count ?? 0);
        completedWrongCount.textContent = Number(result.wrong_count ?? 0);
        completedScore.textContent = Number(result.score ?? 0);
        completedPoints.textContent = Number(result.earned_points ?? 0);
      }

      completedCard.classList.remove("hidden");
    }

    async function goToNextQuestion() {
      if (currentMode === "wrong_question") {
        if (
          lastSubmitResult?.retry_completed === true ||
          lastSubmitResult?.session_completed === true ||
          lastSubmitResult?.mastered === true ||
          lastSubmitResult?.is_correct === true ||
          lastSubmitResult?.rules?.retry_completed === true ||
          lastSubmitResult?.session?.status === "completed"
        ) {
          showCompletedResult(lastSubmitResult);
          return;
        }

        // 答錯後，後端若回傳提示，先顯示提示，再讓學生重作同一題。
        const hint =
          lastSubmitResult?.hint ||
          lastSubmitResult?.hint_text ||
          lastSubmitResult?.ai_hint ||
          "再檢查題目條件與各選項之間的關係，重新作答一次。";

        clearAnswerResult();
        showHint(hint);
        submitButton.textContent = "看完提示後，請重新選擇答案";
        return;
      }

      if (lastSubmitResult?.task_completed) {
        showCompletedResult(lastSubmitResult);
        return;
      }

      const currentOrder = Number(currentData?.current_order || 1);
      const totalQuestions = Number(currentData?.total_questions || 15);
      const nextOrder = Number(lastSubmitResult?.next_order || currentOrder + 1);

      if (currentOrder >= totalQuestions || nextOrder > totalQuestions) {
        showCompletedResult({
          completed_question_count: totalQuestions,
          correct_count: lastSubmitResult?.correct_count || 0,
          wrong_count: lastSubmitResult?.wrong_count || 0,
          score: lastSubmitResult?.score || 0,
          earned_points: lastSubmitResult?.earned_points || 0,
        });
        return;
      }

      clearAnswerResult();
      await loadDailyTask(currentData.daily_task_id, nextOrder);
    }

    submitButton.addEventListener("click", async () => {
      if (!currentData) return;

      if (answerSubmitted) {
        submitButton.disabled = true;
        submitButton.textContent = currentMode === "wrong_question"
          ? "正在處理訂正結果……"
          : "正在載入下一題……";

        try {
          await goToNextQuestion();
        } catch (error) {
          showError([
            "處理下一步失敗",
            "",
            error instanceof Error ? error.message : String(error),
          ].join("\n"));
        }
        return;
      }

      if (!selectedAnswer) return;

      submitButton.disabled = true;
      submitButton.textContent = "正在送出答案……";
      document.querySelectorAll(".option").forEach((button) => {
        button.disabled = true;
      });

      try {
        const result = currentMode === "wrong_question"
          ? await submitWrongQuestionAnswer()
          : await submitDailyAnswer();

        lastSubmitResult = result;
        answerSubmitted = true;

        const submittedAnswer = String(result.selected_answer || selectedAnswer)
          .trim()
          .toUpperCase();
        const isCorrect = result.is_correct === true;

        markAnswerResult(submittedAnswer, isCorrect);

        if (isCorrect) {
          submitButton.textContent = currentMode === "wrong_question"
            ? "✅ 訂正成功！查看結果"
            : result.task_completed
              ? "✅ 答對了！查看今日結果"
              : "✅ 答對了！點擊進入下一題";
          submitButton.classList.remove("answer-wrong");
          submitButton.classList.add("answer-correct");
        } else {
          if (currentMode === "wrong_question") {
            submitButton.textContent = result.retry_completed === true
              ? "❌ 第三次仍未答對｜查看答案與解析"
              : `❌ 第 ${Number(result.attempt_no || 1)} 次未答對｜點擊查看提示後重作`;
          } else {
            submitButton.textContent = result.task_completed
              ? "❌ 答錯了，已加入錯題本｜查看今日結果"
              : "❌ 答錯了，已加入錯題本｜點擊進入下一題";
          }

          submitButton.classList.remove("answer-correct");
          submitButton.classList.add("answer-wrong");
        }

        submitButton.disabled = false;
      } catch (error) {
        answerSubmitted = false;
        document.querySelectorAll(".option").forEach((button) => {
          button.disabled = false;
        });
        submitButton.disabled = false;
        submitButton.textContent = `重新送出答案 ${selectedAnswer}`;

        alert([
          "送出答案失敗",
          "",
          error instanceof Error ? error.message : String(error),
        ].join("\n"));
      }
    });

    reviewWrongButton.addEventListener("click", async () => {
      if (currentMode === "wrong_question") {
        reviewWrongButton.disabled = true;
        reviewWrongButton.textContent = "正在返回錯題本……";

        try {
          /*
           * 先代表學生送出「錯題本」文字訊息，
           * 觸發現有 Make Route → get-wrong-question-book，
           * 然後關閉 LIFF，回到 LINE 後即可看到最新錯題本 Flex。
           */
          await sendMessageAndCloseLiff("錯題本");
          return;
        } catch (error) {
          console.error("返回錯題本失敗：", error);

          reviewWrongButton.disabled = false;
          reviewWrongButton.textContent = "返回錯題本";

          alert([
            "返回錯題本失敗",
            "",
            error instanceof Error ? error.message : String(error),
            "",
            "請確認 LIFF 已啟用 chat_message.write Scope。",
          ].join("\n"));

          return;
        }
      }

      alert("請回到 LINE，從「我的弱點」進入錯題本。");
    });

    extraPracticeButton.addEventListener("click", () => {
      alert("「AI 推薦再練 5 題」將在下一階段接上 generated_practice，且不計入今日基礎分。");
    });

    closePageButton.addEventListener("click", () => {
      if (closeLiffWindow()) {
        return;
      }

      window.close();

      window.setTimeout(() => {
        if (!document.hidden) {
          closeHelp.classList.remove("hidden");
        }
      }, 350);
    });

    closeHelpOkButton.addEventListener("click", () => {
      closeHelp.classList.add("hidden");
    });

    window.addEventListener("DOMContentLoaded", initializeApp);
  </script>
</body>
</html>
